id: printed-long-take
version: 1
craft: printed-long-take
series_tag: Vibe知识大赏 · 印刷长镜头
canvas:
  w: 1920
  h: 1080
  fps: 30
palette:
  bg_top: '#16171B'
  bg_bottom: '#EDE5CD'
  paper: '#EDE5CD'
  ink: '#16171B'
  accent: '#C4332B'
  danger: '#C4332B'
  support: '#DFA443'
  muted: '#5A5850'
  card: '#EDE5CD'
accent_hue:
  opencv_lo: 0
  opencv_hi: 22
type:
  headline:
    family: VKSerif
    weight: 900
    size: 84
    line: 1.2
    where: carved plate / board / sky type plate
  card:
    family: VKSerif
    weight: 900
    size: 64
  kicker:
    family: VKSerif
    weight: 700
    size: 30
  label:
    family: VKSerif
    weight: 900
    size: 44
  number:
    family: VKSerif
    weight: 900
  footnote:
    family: VKSerif
    weight: 500
    size: 24
    color: paper
    band: ink 80%
  subtitle:
    family: VKSerif
    weight: 700
    size: 44
    color: paper
    band_y:
    - 905
    - 1005
    band: ink 80%
layout:
  safe:
    x: 96
    y: 54
  footnote_xy:
  - 120
  - 1048
  subtitle_band:
  - 905
  - 1005
  kicker_xy:
  - 120
  - 100
  headline_xy:
  - 120
  - 220
motion:
  camera: one continuous take; momentum through keys, decelerate into holds
  print_flicker_hz: 12
  max_static_s: 3.0
  transitions:
  - through a structure
  - through steam (<0.5s white)
  - sheet peel
  - seal
  forbidden_transitions:
  - fade
  - dissolve
  - slide
  - page flip
  - zoom cut
density:
  props_per_beat:
  - 2
  - 4
  max_keyword_chars: 14
  numbers_need_footnote: true
  min_layers_per_frame: 3
forbidden:
- smooth shading / gradients / specular
- grey fills (grey only as line density)
- second accent colour (red is one subject only)
- centred title cards / headers in screen space (type lives in the world)
- fades to black, cross-dissolves
- close-up 3D toys
- emoji
structure:
- 生活钩子
- 机制
- 反直觉
- 升华
- 行动+CTA
bgm:
  title: we never
  path: /workspace/vk-distill/assets/bgm/we-never.mp3
  fallback: synth
  start_s: 0
  loop: true
  fade_in_s: 0.8
  fade_out_s: 1.8
  under_voice_lu: -20
  gap_lift_lu: 8
  duck:
    threshold: 0.02
    ratio: 8
    attack_ms: 20
    release_ms: 400
