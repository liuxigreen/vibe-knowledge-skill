id: transit-map
version: 1
craft: transit-map
series_tag: Vibe知识大赏 · 线路图
engine: lemo-opuscar/styles/transit-map (MIT, Copyright (c) 2026 LemoLab) — film.js + gl.js reused, per-episode net.js + timeline.js
canvas: {w: 1920, h: 1080, fps: 30}
palette:
  bg_top: '#F2EEE5'        # printed map paper
  bg_bottom: '#DDD7CB'     # paper under the lens vignette / tilt falloff
  bg_glow: '#FBF9F4'
  paper: '#F2EEE5'
  accent: '#E3002B'        # THE line (story line, pen tip, verdicts) — the only saturated pointing hue
  accent_dim: '#F0A7B3'
  ink: '#1B1C1E'           # routine line, type, plates
  muted: '#77736B'
  bar: '#8A857B'           # neutral comparison lines
  navy: '#1C2856'          # myth line — kept dark (V<90) so it never reads as a second pointing hue
  river: '#BCD6EA'
  river_edge: '#8FB5D6'
  plate: '#1F2124'         # odometer plate
  danger: '#E3002B'
  compare_a: '#1C2856'
  compare_b: '#8A857B'
accent_hue: {opencv_lo: 170, opencv_hi: 180}   # + danger declared → 0–10 also allowed (same red)
type:
  headline: {family: Inter+NotoSC, weight: 800, size: 64}
  station: {family: Inter+NotoSC, weight: 600, size: 22}
  subtitle: {family: NotoSC, weight: 700, size: 40, chip: paper@0.94}
  footnote: {family: NotoSC, weight: 500, size: 22, chip: paper@0.9}
line: {width_px: 15, casing: paper, octilinear: true, tunnel: dashed+casing}
motion:
  max_static_s: 3.0
  camera_move_every_s: [3, 5]
  fixed_timestep: true     # page.render(t) only, SwiftShader WebGL
density:
  props_per_beat: [2, 4]
  max_keyword_chars: 16
  numbers_need_footnote: true
forbidden:
  - flat 2D slideshow cuts (every shot is one camera on one printed sheet)
  - more than one saturated line colour (only red points; ink / grey / dark navy carry the rest)
  - dark or sparse frames — paper stays light, type stays ≥4.5:1
  - emoji, particle soup
structure: [生活钩子, 机制, 反直觉, 升华, 行动+CTA]
bgm:
  title: "we never"
  path: /workspace/vk-distill/assets/bgm/we-never.mp3
  fallback: synth
  start_s: 0
  loop: true
  fade_in_s: 0.8
  fade_out_s: 1.8
  under_voice_lu: -20
  gap_lift_lu: 8
  duck: {threshold: 0.02, ratio: 8, attack_ms: 20, release_ms: 400}
