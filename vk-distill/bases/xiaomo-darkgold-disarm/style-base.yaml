# style-base · 小墨/站外暗金「社交卸防 / 六层课」
# TRUE silent_text_first (2026-10-31 rewrite): on-screen copy IS the script.
# Ref frames: /workspace/vk-emotion-shelf/ref/*.png — bottom lines are designed
# narrative/insight UI, NOT VO subtitle strips. Twin source = zhanwai/huashu.
id: xiaomo-darkgold-disarm
version: 4   # v4 DISTILL-MULTIDIM nine-item harden 2026-10-31
lineage: [vibe-knowledge/darkgold, vibe-knowledge/silent-text-first, 六层卸防·站在外面/小墨标]
series_tag: "Vibe知识大赏 · 社交×话术"
canvas: {w: 1920, h: 1080, fps: 30}
mode: silent_text_first

ref:
  folder: /workspace/vk-emotion-shelf/ref
  source_mp4: /workspace/vk-emotion-shelf/ref/source.mp4
  duration_s: 180.3
  note: "On-screen《六层卸防》. Creator attribution: 站在外面 (huashu); folder once mislabeled 小墨/情绪保质期. has_vo=false."
  has_vo: false
  has_bottom_subtitles: false
  bottom_text_role: designed_narrative   # not closed captions
  twin_diff: /workspace/vk-distill/bases/zhanwai-darkgold-huashu/DIFF.md

palette:
  bg_top:    "#0A0C10"
  bg_bottom: "#121820"
  bg_glow:   "#1A2233"
  accent:    "#FFB347"
  accent_dim: "#7A5524"
  ink:       "#F2EEE6"
  muted:     "#8A8F99"
  bar:       "#5C6270"
  wrong:     "#C84C4C"
  benefit:   "#4CC8C8"   # rare (meter low end only)
  compare_a: "#FFB347"
  compare_b: "#C84C4C"
  card_fill: "#1C1810"
  glow_warm: "#3A2C14"
  danger:    "#C84C4C"

type:
  headline: {family: "VKSerif", weight: 900, size: 96, line: 1.2, tracking: 0.01}
  card:     {family: "VKSerif", weight: 900, size: 140}
  kicker:   {family: "VKSerif", weight: 700, size: 36, color: accent}
  en_kicker: {family: "VKSerif", weight: 600, size: 28, tracking: 0.18, color: accent}
  label:    {family: "VKSerif", weight: 700, size: 40}
  number:   {family: "VKMono", weight: 800}
  footnote: {family: "VKSans", weight: 500, size: 24, color: muted}
  # Designed bottom narrative (SCRIPT), not VO captions
  narrative: {family: "VKSerif", weight: 700, size: 52, color: ink, band_y: [880, 1020], align: center, max_lines: 2, stroke: "#0A0C10"}
  bubble:   {family: "VKSerif", weight: 600, size: 36}
  words_per_screen_main: [8, 18]

layout:
  safe: {x: 110, y: 70}
  kicker_xy: [120, 108]
  layer_meter_xy: [120, 72]
  chapter_xy: [120, 118]
  headline_xy: [120, 250]
  center_stage: [960, 480]
  footnote_xy: [120, 1048]
  narrative_band: [880, 1020]   # designed copy; keep props above ~860

line:
  stroke: 3
  dash: [10, 8]
  glow: {blur: 12, opacity: 0.55}

motion:
  enter: {ease: power3.out, dur: 0.5, stagger: 0.06}
  exit:  {dur: 0.3}
  max_static_s: 3.0
  live_meters: true
  prop_swap_every_beat: true
  bubble_fsm: [dashed_dim, gold_active, red_wrong]
  cut_density_per_min: [4, 8]
  text_dwell_s: [2.5, 5.0]
  # Soft rhythm grammar — do NOT freeze exact cut timestamps
  rhythm_grammar: [layer_title_breath, wrong_right_stack, narrative_punch, concept_card, dual_vote_cta]

density:
  props_per_beat: [2, 4]
  max_keyword_chars: 14
  numbers_need_footnote: true
  layers_typical: 6
  one_idea_per_screen: true
  mute_readable: true

forbidden:
  - VO / narration track
  - traditional subtitle / closed-caption strip as sole body copy
  - under_voice duck as primary mix rule
  - 口播句首吸附 / 每句VO换标题
  - flat gray cards (filled rounded rects as content containers)
  - particle soup / bokeh fields
  - more than one accent doing the pointing (gold=right; red reserved for wrong)
  - emoji
  - copying other channels' series names
  - same primary prop two beats in a row with zero state change

structure: [生活钩子, 片名, 多层机制, 升华, 行动+CTA]

hud:
  layer_meter: {segments: 6, pos: top-left, active: accent, idle: muted}
  chapter: {format: "{n:02d} {name}", tag_pill: true}
  scene_tags: ["熟人篇", "职场篇", "生意场"]

props_allowed:
  - FaceLine
  - DefenseShield
  - ChatStack
  - ChatBubble
  - WrongRightPair
  - StickFigure
  - StickFigureDuo
  - LoadBeamCard
  - RiskBenefit
  - PhoneSketch
  - LayerMeter
  - LayerTitleCard
  - ConceptCard
  - MeetingTable
  - SilenceTimer
  - CautionPills
  - ArcMeter
  - HoleCards
  - TruthCard
  - LayerRecap
  - DualVoteCTA
  - SerifTitleCard
  - Footnote
  - Counter
  - SideMeter
  - DropLine
  - NarrativeLine    # designed bottom script line(s)

signature_shots:
  - layer-title-bilingual
  - wrong-right-chat-stack
  - silence-timer-3s
  - dual-vote-cta
  - concept-card-en-zh
  - narrative-punch-line

bgm:
  title: "we never"
  path: /workspace/vk-distill/assets/bgm/we-never.mp3
  fallback: synth
  start_s: 0
  loop: true
  fade_in_s: 0.8
  fade_out_s: 1.8
  # Silent mix: no voice duck. Target bed loudness for full track.
  target_lufs: -15
  beat_sync_cuts: true
  duck: null

fits_topics:
  - social disarm / elicitation layers
  - wrong-vs-right ask patterns
  - workplace / acquaintance / sales talk
  - EQ vs manipulation CTA

# densest-measured type ladder @1080; see STYLE-BASE §2.2
type_ladder_lock:
  kicker_hud: {size_px: [32, 40], weight: 700, color: accent, pos: top_left}
  hero:       {size_px: [120, 150], weight: 900, color: gold_serif_or_ink, pos: center_title_card}
  callout:    {size_px: [28, 40], weight: [600, 700], color: gold_or_red_frame_ink_body, pos: on_bubble}
  narrative:  {size_px: [44, 56], weight: 700, color: ink_plus_gold_keywords_le_2, pos: bottom_center_designed}
  foot:       {size_px: [22, 28], weight: 500, color: muted, pos: bottom_left}

mode_evidence:
  listen: "continuous BGM bed; no VO formant; has_vo false"
  frames: "center gadgets + designed bottom narrative serif; LayerHUD TL; no caption strip; no talking head"
  lock: silent_text_first
  script_anchor: center_gadget_plus_designed_narrative
  bottom_text_role: designed_narrative

knowledge_anchor:
  cite:
    - "reciprocal self-disclosure (通俗锚)"
    - "Chris Voss mirroring"
    - "FBI Elicitation (灵感/示意)"
  schematic: true
  easy_challenge:
    - "never ask questions overclaim"
    - "teaching manipulation / ethics"
    - "Voss/FBI as official six-layer course"
    - "meter blocks as measured scales"

banned_twins:
  - B1_layer_meter_six_ticks_chapter_pill_hud
  - B2_liuceng_xiefang_bilingual_title_card
  - B3_faceline_defense_shield_meishi_zenmele
  - B4_wrong_right_chat_stack_red_x_gold_check
  - B5_holecards_xianggui_jingpin
  - B6_dual_vote_eq_vs_scheming_your_call
  - B7_six_layer_name_sequence_outline
  - B8_gestalt_zhanwai_liuceng
  - B9_reskin_shield_wrongright_hud_only

motion_densest_beats:
  - hook_faceline_shield      # open / 01.png
  - layer_title_breath        # e.g. 08.png
  - wrong_right_riskbenefit   # densest ~t24–t30
  - holecards_flip            # 30.png
  - dual_vote_cta             # end

alias_of:
  - zhanwai-darkgold-huashu   # same source bytes; do not fork VO base

